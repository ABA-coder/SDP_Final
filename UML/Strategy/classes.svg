,0 0 0 0 399,148.076 L545,148.076 L549,264.35 L553,148.076 L699.106,148.076 A0,0 0 0 0 699.106,148.076 L699.106,61.621 L689.106,51.621 L399,51.621 A0,0 0 0 0 399,51.621" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M689.106,51.621 L689.106,61.621 L699.106,61.621 L689.106,51.621" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="405" y="70.649" fill="#000" font-size="13" textLength="234.997" font-family="Segoe UI">LanguageLearningFacade calls this client.</text><text x="405" y="87.94" fill="#000" font-size="13" textLength="232.394" font-family="Segoe UI">select() returns the strategy's priority list.</text><text x="405" y="105.231" fill="#000" font-size="13" textLength="265.453" font-family="Segoe UI">selectForPractice() fills the chosen session size:</text><text x="405" y="122.522" fill="#000" font-size="13" textLength="255.772" font-family="Segoe UI">priorities, then new words, then other words.</text><text x="405" y="139.813" fill="#000" font-size="13" textLength="279.106" font-family="Segoe UI">Every word appears once; supported size is 1..24.</text></g><g class="entity" data-qualified-name="GMN15" id="ent0016" data-source-line="44"><path d="M130,759.621 L130,898.658 A0,0 0 0 0 130,898.658 L505.631,898.658 A0,0 0 0 0 505.631,898.658 L505.631,769.621 L495.631,759.621 L322,759.621 L318,700.787 L314,759.621 L130,759.621 A0,0 0 0 0 130,759.621" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M495.631,759.621 L495.631,769.621 L505.631,769.621 L495.631,759.621" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="136" y="778.649" fill="#000" font-size="13" textLength="354.631" font-family="Segoe UI">SpacedRepetitionStrategy: studied words due today or earlier;</text><text x="136" y="795.94" fill="#000" font-size="13" textLength="215.192" font-family="Segoe UI">order by due date, then English word.</text><text x="136" y="813.231" fill="#000" font-size="13" textLength="329.469" font-family="Segoe UI">WeakWordsStrategy: studied words, ordered by accuracy,</text><text x="136" y="830.522" fill="#000" font-size="13" textLength="321.312" font-family="Segoe UI">correct-answer streak, then English word (all ascending).</text><line x1="131" y1="833.785" x2="504.631" y2="833.785" style="stroke:#181818;stroke-width:1;"/><text x="136" y="851.813" fill="#000" font-size="13" textLength="331.652" font-family="Segoe UI">A studied word may come from a confirmed learning card</text><text x="136" y="869.104" fill="#000" font-size="13" textLength="179.277" font-family="Segoe UI">or a submitted practice answer.</text><text x="136" y="886.396" fill="#000" font-size="13" textLength="350.816" font-family="Segoe UI">Both algorithms read the same immutable ProgressSnapshot.</text></g><!--class ReviewClient--><g class="entity" data-qualified-name="Patterns.Strategy.ReviewClient" id="ent0002" data-source-line="13"><rect x="308" y="264.621" width="482.429" height="116.445" fill="#F5F7FB" style="stroke:#40546E;stroke-width:0.5;" rx="2.5" ry="2.5"/><ellipse cx="505.63" cy="286.912" rx="11" ry="11" fill="#ADD1B2" style="stroke:#181818;stroke-width:1;"/><path d="M508.396,282.787 Q508.552,282.568 508.74,282.459 Q508.927,282.35 509.146,282.35 Q509.521,282.35 509.755,282.615 Q509.99,282.865 509.99,283.475 L509.99,284.928 Q509.99,285.537 509.755,285.803 Q509.521,286.068 509.146,286.068 Q508.802,286.068 508.599,285.865 Q508.396,285.678 508.287,285.162 Q508.24,284.803 508.052,284.615 Q507.724,284.24 507.115,284.021 Q506.505,283.803 505.88,283.803 Q505.115,283.803 504.474,284.131 Q503.849,284.459 503.349,285.209 Q502.865,285.959 502.865,286.99 L502.865,288.084 Q502.865,289.318 503.755,290.146 Q504.646,290.959 506.24,290.959 Q507.177,290.959 507.833,290.709 Q508.224,290.553 508.646,290.115 Q508.912,289.85 509.052,289.771 Q509.208,289.693 509.412,289.693 Q509.74,289.693 509.99,289.959 Q510.255,290.209 510.255,290.553 Q510.255,290.896 509.912,291.303 Q509.412,291.881 508.615,292.209 Q507.537,292.662 506.24